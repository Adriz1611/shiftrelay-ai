name: Checkout deployment
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: [checkout/manifest.json]
  push:
    branches: [main]
    paths: [checkout/manifest.json]
permissions:
  contents: read
jobs:
  checkout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate checkout manifest
        run: |
          if ! jq -e '.paymentSchemaRevision | type == "string" and length > 0' checkout/manifest.json >/dev/null; then
            echo "::error file=checkout/manifest.json::Checkout manifest is missing paymentSchemaRevision"
            exit 1
          fi
          echo "Checkout manifest validation passed."
